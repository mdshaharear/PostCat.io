server {
    listen 80;
    listen [::]:80;
    server_name postcat.io www.postcat.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://postcat.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.postcat.io;

    ssl_certificate /etc/letsencrypt/live/postcat.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postcat.io/privkey.pem;

    return 301 https://postcat.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name postcat.io;

    ssl_certificate /etc/letsencrypt/live/postcat.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postcat.io/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
