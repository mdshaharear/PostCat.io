name: postcat

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://postcat.io}
    image: postcat:local
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${POSTCAT_BIND_ADDRESS:-127.0.0.1}:${POSTCAT_PORT:-3000}:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    restart: unless-stopped
    stop_grace_period: 20s
