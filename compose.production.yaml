name: postcat

services:
  web:
    image: ${POSTCAT_IMAGE:?POSTCAT_IMAGE must be an immutable GHCR digest reference}
    pull_policy: always
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      CONTABO_S3_ENDPOINT: ${CONTABO_S3_ENDPOINT:-}
      CONTABO_S3_REGION: ${CONTABO_S3_REGION:-default}
      CONTABO_S3_ACCESS_KEY_ID: ${CONTABO_S3_ACCESS_KEY_ID:-}
      CONTABO_S3_SECRET_ACCESS_KEY: ${CONTABO_S3_SECRET_ACCESS_KEY:-}
      CONTABO_S3_PRIVATE_BUCKET: ${CONTABO_S3_PRIVATE_BUCKET:-}
      CONTABO_S3_PUBLIC_BUCKET: ${CONTABO_S3_PUBLIC_BUCKET:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      CONTABO_S3_SIGNED_GET_TTL_SECONDS: ${CONTABO_S3_SIGNED_GET_TTL_SECONDS:-300}
      CONTABO_S3_SIGNED_PUT_TTL_SECONDS: ${CONTABO_S3_SIGNED_PUT_TTL_SECONDS:-120}
      CONTABO_S3_MAX_UPLOAD_BYTES: ${CONTABO_S3_MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "127.0.0.1:3300:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
